name: Signed ARM64 APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keygo-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-host-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Rust formatting and tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            rust/target
          key: rust-android-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Test APK verification script
        run: python3 scripts/test_verify_fork_apk.py
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Unit tests and API lint
        run: ./gradlew testFdroidDebugUnitTest testDebugUnitTest :app:lintFdroidRelease --continue --stacktrace --max-workers=2
      - name: Decode dedicated signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keygo.p12"
          test -s "$RUNNER_TEMP/keygo.p12"
      - name: Assemble signed ARM64 release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keygo.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidRelease --stacktrace --max-workers=2
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/keygo.p12"
      - name: Verify and collect release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-files
          apk=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -type f)
          test -f "$apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee release-files/signature.txt
          "$tools/aapt2" dump badging "$apk" | tee release-files/manifest.txt
          python3 scripts/verify_fork_apk.py "$apk" release-files/manifest.txt
          name="KeyGo-${GITHUB_SHA:0:12}-arm64-v8a.apk"
          cp "$apk" "release-files/$name"
          (cd release-files && sha256sum "$name" > "$name.sha256")
      - name: Build emulator-only staging variant
        run: ./gradlew :app:assembleFdroidStaging -Pkeygo.abis=arm64-v8a,x86_64 --stacktrace --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android10-smoke.sh
      - name: Upload verified release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: signed-arm64-apk
          path: release-files/
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results*
            smoke-results/
          if-no-files-found: warn

  prerelease:
    needs: [rust-tests, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-arm64-apk
          path: release-files
      - name: Publish and retain newest five prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="prerelease-$GITHUB_SHA"
          cat > notes.md <<'NOTES'
          Independently signed KeyGo fork. Package: dev.citali.keygo.
          ARM64 only; Android 8+ declared minimum, including Android 10.
          Rust and Android unit tests, API lint and Android 10 x86_64 staging launch smoke test passed.
          No changes to vault crypto/authentication. Not a full security audit or physical ARM64 validation.
          Installs separately from upstream; no automatic access to an existing upstream vault.
          Keep a verified vault backup. This is a prerelease.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
          else
            gh release create "$tag" release-files/* --target "$GITHUB_SHA" --prerelease --title "KeyGo ARM64 ${GITHUB_SHA:0:12}" --notes-file notes.md
          fi
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --slurp > releases.json
          python3 - <<'PY'
          import json, os, subprocess
          releases = [r for page in json.load(open('releases.json')) for r in page
                      if r['prerelease'] and not r['draft']]
          releases.sort(key=lambda r: r['published_at'], reverse=True)
          for r in releases[5:]:
              subprocess.run(['gh', 'api', '--method', 'DELETE',
                              f"repos/{os.environ['GH_REPO']}/releases/{r['id']}"], check=True)
          PY
